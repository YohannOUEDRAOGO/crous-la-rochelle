name: Surveillance CROUS

on:
  schedule:
    - cron: "*/5 * * * *"   # secours si cron-job.org ne répond pas
  workflow_dispatch:         # déclenché chaque minute par cron-job.org

permissions:
  contents: write

concurrency:
  group: crous
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Vérifier les logements
        run: python crous_la_rochelle.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_ONCE: "1"

      - name: Sauvegarder les logements déjà vus
        run: |
          if [ -f logements_vus.json ]; then
            git config user.name "crous-bot"
            git config user.email "crous-bot@users.noreply.github.com"
            git add logements_vus.json
            if ! git diff --cached --quiet; then
              git commit -m "MAJ logements vus"
              git pull --rebase origin main
              git push
            fi
          fi
